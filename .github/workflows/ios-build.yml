name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (iOS Simulator, no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project GymkhanaTiming/GymkhanaTiming.xcodeproj \
            -scheme GymkhanaTiming \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Fail on compiler warnings (build)
        if: always()
        run: |
          if grep -E ': warning:' build.log; then
            echo "Build produced warnings — treating as failure."
            exit 1
          fi
          echo "No compiler warnings."

      - name: Show available simulators
        if: always()
        run: xcrun simctl list devicetypes

      - name: Run VideoAnalyzerTests on real test videos (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project GymkhanaTiming/GymkhanaTiming.xcodeproj \
            -scheme GymkhanaTiming \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:GymkhanaTimingTests/VideoAnalyzerTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Fail on compiler warnings (test)
        if: always()
        run: |
          if grep -E ': warning:' test.log; then
            echo "Test build produced warnings — treating as failure."
            exit 1
          fi
          echo "No compiler warnings."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build.log
            test.log
